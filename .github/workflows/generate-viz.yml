name: Generate Visualization

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      # Its own output: never regenerate because the SVG landed.
      - 'assets/structure.svg'
  workflow_dispatch:

permissions:
  contents: write
  # The SVG lands through a PR: the automation-guard ruleset requires PRs on
  # main for everyone but the owner, so a direct push is rejected (GH013).
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build rv
        run: cargo build --release

      - name: Generate visualization
        run: ./target/release/rv . -o assets/structure.svg -W 800 -H 600

      - name: Update README with new SVG
        run: |
          if ! grep -q "structure.svg" README.md; then
            echo "SVG reference not found in README, skipping update"
          else
            echo "SVG generated successfully"
          fi

      - name: Land the updated SVG through a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add assets/structure.svg
          if git diff --cached --quiet; then
            echo "Visualization unchanged, nothing to land."
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          title="chore: update project structure visualization"
          branch="viz/${GITHUB_SHA::12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="${branch}-${GITHUB_RUN_ID}"
          fi
          git checkout -b "$branch"
          git commit -m "$title"
          git push origin "$branch"
          pr=$(gh pr create --base "$BASE" --head "$branch" --title "$title" \
                 --body "Regenerated by the Generate Visualization workflow for ${GITHUB_SHA::12}." \
               | awk -F/ '{print $NF}')
          # Wait for any CI on the PR before merging (see release-kit v2): a
          # PR's workflow is loaded from its merge ref, which merging removes.
          sha=$(git rev-parse HEAD)
          runs=""
          for _ in $(seq 12); do
            runs=$(gh run list --commit "$sha" --event pull_request --json databaseId -q '.[].databaseId')
            [ -n "$runs" ] && break
            sleep 5
          done
          for id in $runs; do
            if ! timeout 1800 gh run watch "$id" --exit-status --interval 15 >/dev/null; then
              echo "::error::CI run ${id} on PR #${pr} did not pass within 30 minutes; merge it once it is green"
              exit 1
            fi
          done
          gh pr merge "$pr" --squash --delete-branch || \
          if ! gh pr merge "$pr" --squash; then
            state=$(gh pr view "$pr" --json state -q .state)
            if [ "$state" != "MERGED" ]; then
              echo "::error::PR #${pr} could not be merged (state=${state})"
              exit 1
            fi
          fi
