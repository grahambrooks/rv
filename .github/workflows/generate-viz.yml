name: Generate Visualization

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      # Its own output: never regenerate because the SVG landed.
      - 'assets/structure.svg'
  workflow_dispatch:

permissions:
  contents: write
  # The SVG lands through a PR: the automation-guard ruleset requires PRs on
  # main for everyone but the owner, so a direct push is rejected (GH013).
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build rv
        run: cargo build --release

      - name: Generate visualization
        run: ./target/release/rv . -o assets/structure.svg -W 800 -H 600

      - name: Update README with new SVG
        run: |
          if ! grep -q "structure.svg" README.md; then
            echo "SVG reference not found in README, skipping update"
          else
            echo "SVG generated successfully"
          fi

      - name: Land the updated SVG through a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add assets/structure.svg
          if git diff --cached --quiet; then
            echo "Visualization unchanged, nothing to land."
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          title="chore: update project structure visualization"
          branch="viz/${GITHUB_SHA::12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="${branch}-${GITHUB_RUN_ID}"
          fi
          git checkout -b "$branch"
          # [skip ci] stops GitHub creating a pull_request run for this PR. A PR
          # opened with GITHUB_TOKEN gets runs that wait for approval and never
          # start, and merging turns each into a red "no jobs" run. The squash
          # below sets its own message, so the commit on main still runs CI.
          git commit -m "$title" -m "[skip ci]"
          git push origin "$branch"
          pr=$(gh pr create --base "$BASE" --head "$branch" --title "$title" \
                 --body "Regenerated by the Generate Visualization workflow for ${GITHUB_SHA::12}." \
               | awk -F/ '{print $NF}')
          msg=(--subject "${title} (#${pr})" --body "Regenerated by the Generate Visualization workflow for ${GITHUB_SHA::12}.")
          gh pr merge "$pr" --squash "${msg[@]}" --delete-branch || \
          if ! gh pr merge "$pr" --squash "${msg[@]}"; then
            state=$(gh pr view "$pr" --json state -q .state)
            if [ "$state" != "MERGED" ]; then
              echo "::error::PR #${pr} could not be merged (state=${state})"
              exit 1
            fi
          fi
